<div class="main">
  <div class="container">
    <div class="row">
      <form
        class="form mat-form"
        [formGroup]="signupForm"
        (ngSubmit)="onSignup()"
      >
        <h2 class="heading">Signup</h2>

        <mat-form-field appearance="outline" class="w-100 my-2">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" />
          <mat-error
            *ngIf="
              signupForm.get('name')?.touched && signupForm.get('name')?.invalid
            "
          >
            Name is required.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100 my-2">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
          <mat-error
            *ngIf="
              signupForm.get('email')?.touched &&
              signupForm.get('email')?.invalid
            "
          >
            Enter a valid email.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100 my-2">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" />
          <mat-error
            *ngIf="
              signupForm.get('password')?.touched &&
              signupForm.get('password')?.invalid
            "
          >
            Password must be at least 8 characters long.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100 my-2">
          <mat-label>Confirm Password</mat-label>
          <input matInput type="password" formControlName="confirmPassword" />
          <mat-error *ngIf="signupForm.hasError('passwordMismatch')">
            Passwords do not match.
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="w-100 my-3"
          type="submit"
          [disabled]="signupForm.invalid"
        >
          Submit
        </button>
      </form>
    </div>
    <div class="row">
      <div class="link-row">
        <p>
          Already have an account?
          <a class="link" [routerLink]="['/']">Login here</a>
        </p>
      </div>
    </div>
  </div>
</div>

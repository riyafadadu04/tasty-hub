<div class="main">
  <div class="container">
    <div class="row form-row">
      <form
        class="form mat-form"
        [formGroup]="loginForm"
        (ngSubmit)="onLogin()"
      >
        <h2 class="heading">Login</h2>

        <!-- Email Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            name="email"
            formControlName="email"
            required
          />
          <mat-error
            *ngIf="
              loginForm.get('email')?.invalid && loginForm.get('email')?.touched
            "
          >
            Please enter a valid email.
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            name="password"
            formControlName="password"
            required
          />
          <mat-error
            *ngIf="
              loginForm.get('password')?.invalid &&
              loginForm.get('password')?.touched
            "
          >
            Password is required.
          </mat-error>
        </mat-form-field>

        <!-- Submit Button -->
        <button
          mat-raised-button
          color="primary"
          class="full-width"
          type="submit"
          [disabled]="loginForm.invalid"
        >
          Submit
        </button>
      </form>
    </div>

    <!-- Signup Link -->
    <div class="row link-row">
      <div class="col">
        <p>
          Don't have an account?
          <a class="link" [routerLink]="['/signup']">Sign up here</a>
        </p>
      </div>
    </div>
  </div>
</div>
